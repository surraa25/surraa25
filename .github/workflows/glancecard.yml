
name: glancecard

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: gfazioli/glancecard@v0.6.1
        with:
          profile: surraa25
          repos: |
            surraa25/Pportfolio
          time-zone: Africa/Addis_Ababa

